<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>XOP Viewer</title>
<script src="https://cdn.jsdelivr.net/npm/marked@9/marked.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css" id="hljs-light">
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root {
  --sidebar-w: 260px;
  --topbar-h: 48px;
  --sidebar-bg: #1c1c1e;
  --sidebar-border: #2c2c2e;
  --topbar-bg: #242426;
  --topbar-border: #3a3a3c;
  --accent: #4a9eff;
  --accent-hover: #3a8eef;
  --danger: #ff453a;
  --text-1: #e8e8ea;
  --text-2: #8e8e93;
  --text-3: #5a5a5e;
  --hover-bg: #2a2a2c;
  --selected-bg: #313133;
  --border: #3a3a3c;
  --input-bg: #2c2c2e;
  --btn-bg: #3a3a3c;
  --btn-hover: #4a4a4e;
  --content-bg: #ffffff;
  --preview-bg: #fafafa;
  --source-bg: #1e1e20;
  --source-text: #e8e8ea;
  --tag-html: #ff9f0a;
  --tag-md: #30d158;
  --radius: 6px;
  --radius-sm: 4px;
}

html,body {
  height: 100%;
  background: var(--sidebar-bg);
  color: var(--text-1);
  font-family: -apple-system, 'Helvetica Neue', 'Hiragino Sans', sans-serif;
  font-size: 13px;
  overflow: hidden;
}

/* ── App layout ── */
#app {
  display: grid;
  grid-template-columns: var(--sidebar-w) 1fr;
  grid-template-rows: var(--topbar-h) 1fr;
  height: 100vh;
  transition: grid-template-columns 0.2s ease;
}
#app.sidebar-collapsed {
  grid-template-columns: 0 1fr;
}

/* ── Topbar ── */
#topbar {
  grid-column: 1 / -1;
  grid-row: 1;
  background: var(--topbar-bg);
  border-bottom: 1px solid var(--topbar-border);
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 0 12px;
  overflow: hidden;
  z-index: 10;
}

#sidebar-toggle {
  flex-shrink: 0;
  background: none;
  border: none;
  color: var(--text-2);
  cursor: pointer;
  padding: 4px 6px;
  border-radius: var(--radius-sm);
  font-size: 16px;
  line-height: 1;
}
#sidebar-toggle:hover { background: var(--hover-bg); color: var(--text-1); }

#current-path {
  flex: 1;
  font-size: 11px;
  color: var(--text-2);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-family: 'SF Mono', 'Menlo', monospace;
}

#dirty-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--danger);
  flex-shrink: 0;
  display: none;
}
#dirty-dot.visible { display: block; }

.topbar-sep {
  width: 1px; height: 20px;
  background: var(--border);
  flex-shrink: 0;
}

#mode-buttons {
  display: flex;
  gap: 2px;
}
#mode-buttons button {
  background: none;
  border: 1px solid transparent;
  color: var(--text-2);
  cursor: pointer;
  padding: 3px 10px;
  border-radius: var(--radius-sm);
  font-size: 12px;
  white-space: nowrap;
}
#mode-buttons button:hover { background: var(--hover-bg); color: var(--text-1); }
#mode-buttons button.active {
  background: var(--selected-bg);
  border-color: var(--border);
  color: var(--text-1);
}

#action-buttons {
  display: flex;
  gap: 4px;
  margin-left: 4px;
}
.action-btn {
  background: var(--btn-bg);
  border: none;
  color: var(--text-1);
  cursor: pointer;
  padding: 4px 12px;
  border-radius: var(--radius-sm);
  font-size: 12px;
  white-space: nowrap;
}
.action-btn:hover { background: var(--btn-hover); }
.action-btn.primary {
  background: var(--accent);
  color: #fff;
}
.action-btn.primary:hover { background: var(--accent-hover); }

/* ── Sidebar ── */
#sidebar {
  grid-column: 1;
  grid-row: 2;
  background: var(--sidebar-bg);
  border-right: 1px solid var(--sidebar-border);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
#app.sidebar-collapsed #sidebar { overflow: hidden; }

.sidebar-header {
  padding: 12px;
  border-bottom: 1px solid var(--sidebar-border);
  flex-shrink: 0;
}

.sidebar-title {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.08em;
  color: var(--text-2);
  text-transform: uppercase;
  margin-bottom: 8px;
}

#add-library-btn {
  width: 100%;
  background: var(--input-bg);
  border: 1px dashed var(--border);
  color: var(--text-2);
  cursor: pointer;
  padding: 6px 10px;
  border-radius: var(--radius-sm);
  font-size: 12px;
  display: flex;
  align-items: center;
  gap: 6px;
  transition: border-color 0.15s, color 0.15s;
}
#add-library-btn:hover {
  border-color: var(--accent);
  color: var(--accent);
}
#add-library-btn .icon { font-size: 14px; }

.sidebar-search {
  padding: 8px 12px;
  border-bottom: 1px solid var(--sidebar-border);
  flex-shrink: 0;
}
.sidebar-search input {
  width: 100%;
  background: var(--input-bg);
  border: 1px solid var(--border);
  color: var(--text-1);
  padding: 5px 8px;
  border-radius: var(--radius-sm);
  font-size: 12px;
  outline: none;
}
.sidebar-search input:focus { border-color: var(--accent); }
.sidebar-search input::placeholder { color: var(--text-3); }

.sidebar-filters {
  padding: 6px 12px;
  border-bottom: 1px solid var(--sidebar-border);
  display: flex;
  align-items: center;
  gap: 6px;
  flex-shrink: 0;
}
.filter-tabs {
  display: flex;
  gap: 2px;
  flex: 1;
}
.filter-tab {
  background: none;
  border: none;
  color: var(--text-2);
  cursor: pointer;
  padding: 3px 8px;
  border-radius: var(--radius-sm);
  font-size: 11px;
  font-weight: 500;
}
.filter-tab:hover { background: var(--hover-bg); }
.filter-tab.active { background: var(--selected-bg); color: var(--text-1); }

.sort-select {
  background: var(--input-bg);
  border: 1px solid var(--border);
  color: var(--text-2);
  padding: 2px 4px;
  border-radius: var(--radius-sm);
  font-size: 11px;
  outline: none;
  cursor: pointer;
}

#file-tree {
  flex: 1;
  overflow-y: auto;
  padding: 4px 0;
}
#file-tree::-webkit-scrollbar { width: 4px; }
#file-tree::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

/* ── Tree nodes ── */
.library-root {
  margin-bottom: 2px;
}
.library-root-header {
  display: flex;
  align-items: center;
  padding: 5px 8px 5px 12px;
  cursor: pointer;
  color: var(--text-2);
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.04em;
  gap: 4px;
}
.library-root-header:hover { background: var(--hover-bg); color: var(--text-1); }
.library-root-header .remove-lib {
  opacity: 0;
  background: none;
  border: none;
  color: var(--text-3);
  cursor: pointer;
  padding: 0 3px;
  font-size: 13px;
  line-height: 1;
  border-radius: 2px;
  flex-shrink: 0;
}
.library-root-header .remove-lib:first-of-type { margin-left: auto; }
.library-root-header:hover .remove-lib { opacity: 1; }
.library-root-header .remove-lib:hover { color: var(--accent); }
.library-root-header .remove-lib:last-child:hover { color: var(--danger); }

.tree-folder {
  user-select: none;
}
.tree-folder-header {
  display: flex;
  align-items: center;
  padding: 3px 8px;
  cursor: pointer;
  gap: 4px;
  border-radius: 0;
}
.tree-folder-header:hover { background: var(--hover-bg); }

.tree-file {
  display: flex;
  align-items: center;
  padding: 3px 8px;
  cursor: pointer;
  gap: 6px;
  border-radius: 0;
}
.tree-file:hover { background: var(--hover-bg); }
.tree-file.selected { background: var(--selected-bg); }

.tree-icon { font-size: 13px; flex-shrink: 0; }
.tree-chevron { font-size: 10px; color: var(--text-3); flex-shrink: 0; width: 12px; }
.tree-name {
  flex: 1;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-size: 12px;
}
.tree-meta {
  font-size: 10px;
  color: var(--text-3);
  flex-shrink: 0;
  white-space: nowrap;
}

.file-type-badge {
  font-size: 9px;
  font-weight: 700;
  padding: 1px 4px;
  border-radius: 3px;
  flex-shrink: 0;
  letter-spacing: 0.04em;
}
.badge-html { background: #ff9f0a22; color: var(--tag-html); }
.badge-md   { background: #30d15822; color: var(--tag-md); }

.restore-banner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 6px 12px;
  background: #ff9f0a18;
  border-bottom: 1px solid #ff9f0a33;
  font-size: 11px;
  color: #ff9f0a;
  flex-shrink: 0;
}
.restore-banner button {
  background: #ff9f0a;
  border: none;
  color: #000;
  padding: 2px 8px;
  border-radius: 3px;
  cursor: pointer;
  font-size: 11px;
  font-weight: 600;
}

/* ── Main content ── */
#main {
  grid-column: 2;
  grid-row: 2;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  background: var(--content-bg);
}

#content {
  flex: 1;
  overflow: hidden;
  display: flex;
  position: relative;
}

/* ── Empty state ── */
#empty-state {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 12px;
  height: 100%;
  width: 100%;
  color: var(--text-3);
  background: var(--sidebar-bg);
}
#empty-state .empty-icon { font-size: 48px; }
#empty-state p { font-size: 13px; color: var(--text-2); }
#empty-state small { font-size: 11px; color: var(--text-3); }

/* ── HTML viewer ── */
#html-viewer {
  display: none;
  flex: 1;
  overflow: hidden;
}
#html-viewer iframe {
  width: 100%;
  height: 100%;
  border: none;
  display: block;
}

/* ── MD modes ── */
#md-source, #md-split, #md-preview {
  display: none;
  flex: 1;
  overflow: hidden;
}

#md-source textarea, #split-source {
  width: 100%;
  height: 100%;
  background: var(--source-bg);
  color: var(--source-text);
  border: none;
  padding: 20px;
  font-family: 'SF Mono', 'Menlo', 'Consolas', monospace;
  font-size: 13px;
  line-height: 1.7;
  resize: none;
  outline: none;
  tab-size: 2;
}

#md-split {
  flex-direction: row;
}
#split-source-wrap {
  flex: 1;
  overflow: hidden;
  border-right: 1px solid var(--border);
}
#split-source {
  width: 100%;
  height: 100%;
  background: var(--source-bg);
  color: var(--source-text);
  border: none;
  padding: 20px;
  font-family: 'SF Mono', 'Menlo', 'Consolas', monospace;
  font-size: 13px;
  line-height: 1.7;
  resize: none;
  outline: none;
  tab-size: 2;
}
#split-preview-wrap {
  flex: 1;
  overflow-y: auto;
  background: var(--preview-bg);
}
#split-preview-wrap::-webkit-scrollbar { width: 6px; }
#split-preview-wrap::-webkit-scrollbar-thumb { background: #ccc; border-radius: 3px; }

#md-preview {
  overflow-y: auto;
  background: var(--preview-bg);
}
#md-preview::-webkit-scrollbar { width: 6px; }
#md-preview::-webkit-scrollbar-thumb { background: #ccc; border-radius: 3px; }

.md-rendered {
  max-width: 760px;
  margin: 0 auto;
  padding: 40px 40px;
  color: #1a1a1a;
  line-height: 1.75;
  font-size: 15px;
}

/* ── Markdown rendered styles ── */
.md-rendered h1 { font-size: 2em; font-weight: 700; margin: 0 0 .5em; border-bottom: 2px solid #e8e8e8; padding-bottom: .3em; }
.md-rendered h2 { font-size: 1.5em; font-weight: 700; margin: 1.5em 0 .5em; border-bottom: 1px solid #e8e8e8; padding-bottom: .2em; }
.md-rendered h3 { font-size: 1.2em; font-weight: 600; margin: 1.2em 0 .4em; }
.md-rendered h4 { font-size: 1em; font-weight: 600; margin: 1em 0 .3em; }
.md-rendered p { margin: .8em 0; }
.md-rendered ul, .md-rendered ol { margin: .6em 0; padding-left: 1.6em; }
.md-rendered li { margin: .25em 0; }
.md-rendered blockquote {
  margin: 1em 0;
  padding: .5em 1em;
  border-left: 4px solid #d0d0d0;
  color: #555;
  background: #f8f8f8;
  border-radius: 0 4px 4px 0;
}
.md-rendered code {
  font-family: 'SF Mono', 'Menlo', monospace;
  font-size: .88em;
  background: #f0f0f0;
  padding: .15em .35em;
  border-radius: 3px;
}
.md-rendered pre {
  margin: 1em 0;
  border-radius: 8px;
  overflow: hidden;
}
.md-rendered pre code {
  background: none;
  padding: 0;
  font-size: .85em;
}
.md-rendered pre.hljs {
  padding: 16px 20px;
  overflow-x: auto;
}
.md-rendered hr { border: none; border-top: 1px solid #e0e0e0; margin: 1.5em 0; }
.md-rendered a { color: #3a7eef; text-decoration: none; }
.md-rendered a:hover { text-decoration: underline; }
.md-rendered table { border-collapse: collapse; width: 100%; margin: 1em 0; }
.md-rendered th, .md-rendered td { border: 1px solid #e0e0e0; padding: 6px 12px; text-align: left; }
.md-rendered th { background: #f5f5f5; font-weight: 600; }
.md-rendered img { max-width: 100%; border-radius: 4px; }
.md-rendered strong { font-weight: 700; }
.md-rendered em { font-style: italic; }

/* ── Toast ── */
#toast-container {
  position: fixed;
  bottom: 20px;
  right: 20px;
  z-index: 1000;
  display: flex;
  flex-direction: column;
  gap: 8px;
  pointer-events: none;
}
.toast {
  background: #2c2c2e;
  color: #e8e8ea;
  padding: 10px 16px;
  border-radius: var(--radius);
  font-size: 13px;
  border-left: 3px solid var(--accent);
  box-shadow: 0 4px 16px rgba(0,0,0,0.4);
  animation: toast-in 0.2s ease;
  pointer-events: auto;
}
.toast.error { border-left-color: var(--danger); }
.toast.success { border-left-color: var(--tag-md); }
@keyframes toast-in { from { transform: translateX(20px); opacity: 0; } }

/* ── Protocol warning ── */
#proto-warn {
  display: none;
  position: fixed;
  top: 0; left: 0; right: 0;
  background: #ff453a;
  color: #fff;
  text-align: center;
  padding: 8px 16px;
  font-size: 12px;
  z-index: 999;
}

/* ── Resizer ── */
#sidebar-resizer {
  position: absolute;
  left: var(--sidebar-w);
  top: var(--topbar-h);
  width: 4px;
  height: calc(100vh - var(--topbar-h));
  cursor: col-resize;
  z-index: 20;
  background: transparent;
}
#sidebar-resizer:hover, #sidebar-resizer.dragging {
  background: var(--accent);
}

/* ── Scrollbar for source textarea ── */
textarea::-webkit-scrollbar { width: 6px; height: 6px; }
textarea::-webkit-scrollbar-thumb { background: #555; border-radius: 3px; }

/* ── Loading spinner ── */
.spinner {
  display: inline-block;
  width: 12px; height: 12px;
  border: 2px solid var(--border);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 0.7s linear infinite;
  flex-shrink: 0;
}
@keyframes spin { to { transform: rotate(360deg); } }

.tree-loading {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 12px 16px;
  color: var(--text-3);
  font-size: 12px;
}

.tree-empty {
  padding: 20px 16px;
  text-align: center;
  color: var(--text-3);
  font-size: 12px;
  line-height: 1.6;
}

.lib-count {
  font-size: 10px;
  color: var(--text-3);
  font-weight: 400;
  margin-left: 2px;
}

/* ── PDF viewer ── */
#pdf-viewer { flex: 1; overflow: hidden; }
#pdf-viewer iframe { width: 100%; height: 100%; border: none; display: block; }

/* ── Excel viewer ── */
#xlsx-viewer {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  background: #fff;
}
#xlsx-tabs {
  display: flex;
  gap: 2px;
  padding: 6px 12px 0;
  background: #f0f0f0;
  border-bottom: 1px solid #ddd;
  overflow-x: auto;
  flex-shrink: 0;
}
#xlsx-tabs::-webkit-scrollbar { height: 4px; }
.xlsx-tab {
  padding: 5px 14px;
  font-size: 12px;
  cursor: pointer;
  border-radius: 4px 4px 0 0;
  border: 1px solid transparent;
  border-bottom: none;
  background: transparent;
  color: #555;
  white-space: nowrap;
  flex-shrink: 0;
}
.xlsx-tab:hover { background: #e0e0e0; }
.xlsx-tab.active { background: #fff; border-color: #ddd; color: #1a1a1a; font-weight: 600; }
#xlsx-content {
  flex: 1;
  overflow: auto;
  padding: 0;
}
#xlsx-content::-webkit-scrollbar { width: 8px; height: 8px; }
#xlsx-content::-webkit-scrollbar-thumb { background: #ccc; border-radius: 4px; }
.xlsx-table-wrap { padding: 0; }
.xlsx-table {
  border-collapse: collapse;
  font-size: 12px;
  font-family: -apple-system, sans-serif;
  white-space: nowrap;
}
.xlsx-table th {
  background: #f5f5f5;
  border: 1px solid #d0d0d0;
  padding: 3px 8px;
  text-align: center;
  font-weight: 600;
  position: sticky;
  top: 0;
  z-index: 1;
  min-width: 60px;
}
.xlsx-table td {
  border: 1px solid #e0e0e0;
  padding: 3px 8px;
  max-width: 240px;
  overflow: hidden;
  text-overflow: ellipsis;
  color: #1a1a1a;
}
.xlsx-row-header {
  background: #f5f5f5;
  font-weight: 600;
  text-align: center;
  color: #666;
  border: 1px solid #d0d0d0;
  position: sticky;
  left: 0;
  z-index: 1;
}
.xlsx-empty { padding: 40px; text-align: center; color: #888; font-size: 13px; }

/* ── PPTX viewer ── */
#pptx-viewer {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  background: #1a1a1a;
}
#pptx-canvas-wrap {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: auto;
  padding: 24px;
}
#pptx-canvas {
  position: relative;
  flex-shrink: 0;
  background: #fff;
  box-shadow: 0 8px 32px rgba(0,0,0,0.6);
  overflow: hidden;
}
#pptx-nav {
  height: 52px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 16px;
  background: #242424;
  border-top: 1px solid #333;
}
#pptx-nav button {
  background: #3a3a3c;
  border: none;
  color: #e8e8ea;
  padding: 6px 16px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 13px;
}
#pptx-nav button:hover { background: #4a4a4e; }
#pptx-nav button:disabled { opacity: 0.3; cursor: default; }
#slide-counter { color: #8e8e93; font-size: 13px; min-width: 64px; text-align: center; }
#pptx-thumb-strip {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  padding: 0 12px;
  flex: 1;
  align-items: center;
}
.pptx-thumb {
  flex-shrink: 0;
  width: 80px;
  height: 45px;
  background: #fff;
  border: 2px solid transparent;
  border-radius: 3px;
  cursor: pointer;
  overflow: hidden;
  position: relative;
}
.pptx-thumb.active { border-color: var(--accent); }
.pptx-thumb span {
  position: absolute;
  bottom: 2px;
  right: 4px;
  font-size: 8px;
  color: #666;
}
.pptx-el {
  position: absolute;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  justify-content: flex-start;
}
.pptx-el p { margin: 0; }

/* ── Badge colors for new types ── */
.badge-pdf  { background: #ff375722; color: #ff3757; }
.badge-xlsx { background: #30d15822; color: #1a9e40; }
.badge-pptx { background: #ff9f0a22; color: #e08000; }

/* ── Print ── */
@media print {
  #sidebar, #topbar, #toast-container, #proto-warn { display: none !important; }
  #app { display: block; }
  #main { grid-column: 1; }
  #content { overflow: visible; }
  #md-preview, #md-preview-content { overflow: visible; height: auto; }
  .md-rendered { max-width: 100%; padding: 0; }
  .md-rendered pre { break-inside: avoid; }
  .md-rendered h2, .md-rendered h3 { break-after: avoid; }
}
</style>
</head>
<body>

<div id="proto-warn">
  ⚠️ このアプリは localhost 経由で開く必要があります。
  <code>python -m http.server 8080</code> を実行後、<a href="http://localhost:8080/viewer.html" style="color:#fff">http://localhost:8080/viewer.html</a> を開いてください。
</div>

<div id="app">
  <!-- Topbar -->
  <div id="topbar">
    <button id="sidebar-toggle" title="サイドバー切替">☰</button>
    <span id="current-path">ファイルを選択してください</span>
    <span id="dirty-dot" title="未保存の変更があります"></span>
    <div class="topbar-sep"></div>
    <div id="mode-buttons"></div>
    <div id="action-buttons">
      <button class="action-btn" id="pdf-btn" style="display:none" onclick="printFile()">PDF</button>
      <button class="action-btn" id="export-btn" style="display:none" onclick="exportHTML()">書き出し</button>
      <button class="action-btn primary" id="save-btn" style="display:none" onclick="saveFile()">保存</button>
    </div>
  </div>

  <!-- Sidebar -->
  <div id="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-title">ライブラリ</div>
      <button id="add-library-btn" onclick="addLibrary()">
        <span class="icon">＋</span> フォルダを追加
      </button>
    </div>
    <div class="sidebar-search">
      <input type="text" id="search-input" placeholder="検索（ファイル名）" oninput="onSearch(this.value)">
    </div>
    <div class="sidebar-filters">
      <div class="filter-tabs">
        <button class="filter-tab active" data-filter="all" onclick="setFilter('all')">ALL</button>
        <button class="filter-tab" data-filter="html" onclick="setFilter('html')">HTML</button>
        <button class="filter-tab" data-filter="md" onclick="setFilter('md')">MD</button>
        <button class="filter-tab" data-filter="pdf" onclick="setFilter('pdf')">PDF</button>
        <button class="filter-tab" data-filter="xlsx" onclick="setFilter('xlsx')">XLS</button>
        <button class="filter-tab" data-filter="pptx" onclick="setFilter('pptx')">PPT</button>
      </div>
      <select class="sort-select" id="sort-select" onchange="setSort(this.value)">
        <option value="date-desc">日付↓</option>
        <option value="date-asc">日付↑</option>
        <option value="name-asc">名前↑</option>
        <option value="name-desc">名前↓</option>
      </select>
    </div>
    <div id="file-tree"></div>
  </div>

  <!-- Main content -->
  <div id="main">
    <div id="content">
      <!-- Empty state -->
      <div id="empty-state">
        <div class="empty-icon">📂</div>
        <p>左のサイドバーからフォルダを追加してください</p>
        <small>HTML / MD / PDF / Excel / PowerPoint を閲覧・編集できます</small>
      </div>

      <!-- HTML viewer -->
      <div id="html-viewer">
        <iframe id="html-iframe" sandbox="allow-scripts allow-same-origin allow-forms" title="HTMLプレビュー"></iframe>
      </div>

      <!-- MD: source only -->
      <div id="md-source">
        <textarea id="md-source-ta" spellcheck="false" oninput="onSourceInput(this.value)"></textarea>
      </div>

      <!-- MD: split -->
      <div id="md-split">
        <div id="split-source-wrap">
          <textarea id="split-source" spellcheck="false" oninput="onSourceInput(this.value)" onscroll="syncScroll(this)"></textarea>
        </div>
        <div id="split-preview-wrap">
          <div id="split-preview" class="md-rendered"></div>
        </div>
      </div>

      <!-- MD: preview only -->
      <div id="md-preview">
        <div id="md-preview-content" class="md-rendered"></div>
      </div>

      <!-- PDF viewer -->
      <div id="pdf-viewer">
        <iframe id="pdf-iframe" title="PDFプレビュー"></iframe>
      </div>

      <!-- Excel viewer -->
      <div id="xlsx-viewer">
        <div id="xlsx-tabs"></div>
        <div id="xlsx-content"></div>
      </div>

      <!-- PPTX viewer -->
      <div id="pptx-viewer">
        <div id="pptx-canvas-wrap">
          <div id="pptx-canvas"></div>
        </div>
        <div id="pptx-nav">
          <button id="pptx-prev" onclick="prevSlide()">◀ 前へ</button>
          <div id="pptx-thumb-strip"></div>
          <span id="slide-counter">– / –</span>
          <button id="pptx-next" onclick="nextSlide()">次へ ▶</button>
        </div>
      </div>
    </div>
  </div>
</div>

<div id="toast-container"></div>

<script>
// ─────────────────────────────────────────────
// State
// ─────────────────────────────────────────────
const state = {
  libraries: [],
  currentFile: null,
  currentMode: 'preview',
  filter: 'all',
  sort: 'date-desc',
  searchQuery: '',
  isDirty: false,
  pptxSlides: [],
  currentSlide: 0,
  pdfBlobUrl: null,
  xlsxWorkbook: null,
};

// ─────────────────────────────────────────────
// IndexedDB
// ─────────────────────────────────────────────
const DB = (() => {
  const NAME = 'xop-viewer', STORE = 'dirs', VER = 1;
  let db;

  async function open() {
    return new Promise((res, rej) => {
      const req = indexedDB.open(NAME, VER);
      req.onupgradeneeded = e => e.target.result.createObjectStore(STORE, { keyPath: 'id' });
      req.onsuccess = e => { db = e.target.result; res(db); };
      req.onerror = e => rej(e.target.error);
    });
  }

  async function getAll() {
    await open();
    return new Promise((res, rej) => {
      const tx = db.transaction(STORE, 'readonly');
      const req = tx.objectStore(STORE).getAll();
      req.onsuccess = () => res(req.result);
      req.onerror = () => rej(req.error);
    });
  }

  async function put(record) {
    await open();
    return new Promise((res, rej) => {
      const tx = db.transaction(STORE, 'readwrite');
      const req = tx.objectStore(STORE).put(record);
      req.onsuccess = () => res();
      req.onerror = () => rej(req.error);
    });
  }

  async function remove(id) {
    await open();
    return new Promise((res, rej) => {
      const tx = db.transaction(STORE, 'readwrite');
      const req = tx.objectStore(STORE).delete(id);
      req.onsuccess = () => res();
      req.onerror = () => rej(req.error);
    });
  }

  return { getAll, put, remove };
})();

// ─────────────────────────────────────────────
// File System
// ─────────────────────────────────────────────
const pendingHandles = new Map(); // id → handle (for restore banners)

async function addLibrary() {
  if (!window.showDirectoryPicker) {
    toast('File System Access API が使えません。Chrome/Edge を使用し、localhost 経由で開いてください。', 'error');
    return;
  }
  try {
    const handle = await window.showDirectoryPicker({ mode: 'readwrite' });
    const id = `lib_${Date.now()}`;
    await DB.put({ id, handle, name: handle.name });

    // Placeholder while scanning
    const treeEl = document.getElementById('file-tree');
    const placeholder = document.createElement('div');
    placeholder.className = 'tree-loading';
    placeholder.id = `scan-spinner-${id}`;
    placeholder.innerHTML = `<span class="spinner"></span><span>${escapeHtml(handle.name)} をスキャン中…</span>`;
    treeEl.appendChild(placeholder);

    await loadLibrary({ id, handle, name: handle.name }, false);
  } catch (e) {
    if (e.name !== 'AbortError') toast(`フォルダを開けませんでした: ${e.message}`, 'error');
  }
}

async function loadLibrary({ id, handle, name }, showLoading = false) {
  try {
    const perm = await handle.queryPermission({ mode: 'readwrite' });
    if (perm !== 'granted') return { id, handle, name, needsRestore: true };

    if (showLoading) {
      const existing = document.getElementById(`lib-${id}`);
      existing?.querySelector('.library-root-header')?.insertAdjacentHTML(
        'beforeend', `<span class="spinner" id="scan-spinner-${id}"></span>`
      );
    }

    const files = await scanDir(handle, handle.name, id);
    document.getElementById(`scan-spinner-${id}`)?.remove();

    const lib = { id, handle, name, files };
    const idx = state.libraries.findIndex(l => l.id === id);
    if (idx >= 0) state.libraries[idx] = lib;
    else state.libraries.push(lib);
    renderTree();
    return lib;
  } catch (e) {
    document.getElementById(`scan-spinner-${id}`)?.remove();
    toast(`ライブラリの読み込みに失敗しました: ${e.message}`, 'error');
  }
}

async function rescanLibrary(id) {
  const lib = state.libraries.find(l => l.id === id);
  if (!lib) return;
  await loadLibrary({ id: lib.id, handle: lib.handle, name: lib.name }, true);
  toast(`「${lib.name}」を再スキャンしました`, 'success');
}

async function restoreLibrary(id) {
  const handle = pendingHandles.get(id);
  const name = handle?.name || id;
  if (!handle) return;
  try {
    const perm = await handle.requestPermission({ mode: 'readwrite' });
    if (perm === 'granted') {
      await loadLibrary({ id, handle, name });
      document.getElementById(`restore-${id}`)?.remove();
    }
  } catch (e) {
    toast('権限の復元に失敗しました', 'error');
  }
}

async function removeLibrary(id) {
  state.libraries = state.libraries.filter(l => l.id !== id);
  await DB.remove(id);
  if (state.currentFile?.libId === id) closeFile();
  renderTree();
}

async function scanDir(dirHandle, basePath, libId) {
  const files = [];
  for await (const [name, handle] of dirHandle.entries()) {
    const path = `${basePath}/${name}`;
    if (handle.kind === 'directory') {
      const sub = await scanDir(handle, path, libId);
      if (sub.length) files.push({ type: 'dir', name, path, handle, children: sub });
    } else {
      const ext = name.split('.').pop().toLowerCase();
      const typeMap = { html:'html', htm:'html', md:'md', markdown:'md', pdf:'pdf', xlsx:'xlsx', xls:'xlsx', csv:'xlsx', pptx:'pptx', ppt:'pptx' };
      if (typeMap[ext]) {
        const file = await handle.getFile();
        files.push({
          type: 'file',
          name,
          path,
          handle,
          ext: typeMap[ext],
          size: file.size,
          modified: file.lastModified,
          libId,
        });
      }
    }
  }
  return files;
}

async function openFile(fileNode) {
  if (state.isDirty) {
    if (!confirm(`「${state.currentFile?.handle.name}」に未保存の変更があります。破棄しますか？`)) return;
  }
  try {
    const file = await fileNode.handle.getFile();
    const isBinary = ['pdf', 'xlsx', 'pptx'].includes(fileNode.ext);
    const content = isBinary ? await file.arrayBuffer() : await file.text();
    state.currentFile = { handle: fileNode.handle, path: fileNode.path, libId: fileNode.libId, type: fileNode.ext, content };
    state.isDirty = false;
    await renderFile();
    updateTopbar();
    document.getElementById('current-path').textContent = fileNode.path;
    document.querySelectorAll('.tree-file').forEach(el => el.classList.remove('selected'));
    document.querySelector(`[data-path="${CSS.escape(fileNode.path)}"]`)?.classList.add('selected');
    try { localStorage.setItem('xop-last-path', fileNode.path); } catch {}
  } catch (e) {
    toast(`ファイルを開けませんでした: ${e.message}`, 'error');
  }
}

function closeFile() {
  state.currentFile = null;
  state.isDirty = false;
  showPanel('empty');
  document.getElementById('current-path').textContent = 'ファイルを選択してください';
  updateTopbar();
}

async function saveFile() {
  if (!state.currentFile) return;
  try {
    const content = getEditorContent();
    const writable = await state.currentFile.handle.createWritable();
    await writable.write(content);
    await writable.close();
    state.currentFile.content = content;
    setDirty(false);
    toast('保存しました', 'success');
  } catch (e) {
    toast(`保存に失敗しました: ${e.message}`, 'error');
  }
}

// ─────────────────────────────────────────────
// Rendering
// ─────────────────────────────────────────────
async function renderFile() {
  const { type, content } = state.currentFile;
  if (type === 'html') {
    renderHTML(content);
  } else if (type === 'md') {
    state.currentMode = 'preview';
    renderMD(content, 'preview');
  } else if (type === 'pdf') {
    renderPDF(content);
  } else if (type === 'xlsx') {
    renderXLSX(content);
  } else if (type === 'pptx') {
    await renderPPTX(content);
  }
}

function renderHTML(content) {
  showPanel('html');
  document.getElementById('html-iframe').srcdoc = content;
}

function renderMD(content, mode) {
  state.currentMode = mode;
  if (mode === 'source') {
    showPanel('md-source');
    document.getElementById('md-source-ta').value = content;
  } else if (mode === 'split') {
    showPanel('md-split');
    document.getElementById('split-source').value = content;
    document.getElementById('split-preview').innerHTML = parseMD(content);
    applyHighlight(document.getElementById('split-preview'));
  } else {
    showPanel('md-preview');
    document.getElementById('md-preview-content').innerHTML = parseMD(content);
    applyHighlight(document.getElementById('md-preview-content'));
  }
  updateModeButtons();
}

function parseMD(content) {
  if (typeof marked === 'undefined') return `<pre>${escapeHtml(content)}</pre>`;
  marked.setOptions({ breaks: true, gfm: true });
  return marked.parse(content);
}

function applyHighlight(container) {
  if (typeof hljs === 'undefined') return;
  container.querySelectorAll('pre code').forEach(block => {
    hljs.highlightElement(block);
    block.parentElement.classList.add('hljs');
  });
}

function showPanel(name) {
  const map = {
    'empty':      'empty-state',
    'html':       'html-viewer',
    'md-source':  'md-source',
    'md-split':   'md-split',
    'md-preview': 'md-preview',
    'pdf':        'pdf-viewer',
    'xlsx':       'xlsx-viewer',
    'pptx':       'pptx-viewer',
  };
  Object.values(map).forEach(id => {
    document.getElementById(id).style.display = 'none';
  });
  const target = map[name];
  if (target) document.getElementById(target).style.display = 'flex';
  // Cleanup old PDF blob
  if (name !== 'pdf' && state.pdfBlobUrl) {
    URL.revokeObjectURL(state.pdfBlobUrl);
    state.pdfBlobUrl = null;
  }
}

// ─────────────────────────────────────────────
// Topbar
// ─────────────────────────────────────────────
function updateTopbar() {
  const { currentFile } = state;
  const modeEl = document.getElementById('mode-buttons');
  const saveBtn = document.getElementById('save-btn');
  const exportBtn = document.getElementById('export-btn');
  const pdfBtn = document.getElementById('pdf-btn');

  if (!currentFile) {
    modeEl.innerHTML = '';
    saveBtn.style.display = 'none';
    exportBtn.style.display = 'none';
    pdfBtn.style.display = 'none';
    return;
  }

  const type = currentFile.type;
  const isText = type === 'html' || type === 'md';
  saveBtn.style.display = isText ? '' : 'none';
  pdfBtn.style.display = (type === 'md' || type === 'html') ? '' : 'none';
  exportBtn.style.display = type === 'md' ? '' : 'none';

  if (type === 'html') {
    modeEl.innerHTML = `<button class="active">閲覧</button>`;
  } else if (type === 'md') {
    modeEl.innerHTML = `
      <button data-mode="source" onclick="switchMode('source')">ソース</button>
      <button data-mode="split"  onclick="switchMode('split')">並列</button>
      <button data-mode="preview" onclick="switchMode('preview')">プレビュー</button>
    `;
    updateModeButtons();
  } else {
    modeEl.innerHTML = `<button class="active">閲覧</button>`;
  }
}

function updateModeButtons() {
  document.querySelectorAll('#mode-buttons button[data-mode]').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.mode === state.currentMode);
  });
}

function switchMode(mode) {
  if (!state.currentFile || state.currentFile.type !== 'md') return;
  const content = getEditorContent();
  state.currentFile.content = content;
  renderMD(content, mode);
}

function getEditorContent() {
  if (!state.currentFile) return '';
  if (state.currentFile.type === 'html') return state.currentFile.content;
  if (state.currentMode === 'source') return document.getElementById('md-source-ta').value;
  if (state.currentMode === 'split') return document.getElementById('split-source').value;
  return state.currentFile.content;
}

// ─────────────────────────────────────────────
// Editor events
// ─────────────────────────────────────────────
function onSourceInput(value) {
  setDirty(true);
  if (state.currentMode === 'split') {
    const preview = document.getElementById('split-preview');
    preview.innerHTML = parseMD(value);
    applyHighlight(preview);
  }
}

function syncScroll(sourceEl) {
  const ratio = sourceEl.scrollTop / (sourceEl.scrollHeight - sourceEl.clientHeight);
  const previewWrap = document.getElementById('split-preview-wrap');
  previewWrap.scrollTop = ratio * (previewWrap.scrollHeight - previewWrap.clientHeight);
}

function setDirty(dirty) {
  state.isDirty = dirty;
  document.getElementById('dirty-dot').classList.toggle('visible', dirty);
}

// ─────────────────────────────────────────────
// File tree rendering
// ─────────────────────────────────────────────
function countFiles(nodes) {
  let n = 0;
  for (const node of nodes) {
    if (node.type === 'file') n++;
    else if (node.children) n += countFiles(node.children);
  }
  return n;
}

function renderTree() {
  const container = document.getElementById('file-tree');
  if (!state.libraries.length) {
    container.innerHTML = '<div class="tree-empty">フォルダを追加してください</div>';
    return;
  }
  container.innerHTML = '';
  state.libraries.forEach(lib => {
    container.appendChild(buildLibraryNode(lib));
  });
}

function buildLibraryNode(lib) {
  const root = document.createElement('div');
  root.className = 'library-root';
  root.id = `lib-${lib.id}`;

  const total = countFiles(lib.files);
  const header = document.createElement('div');
  header.className = 'library-root-header';
  header.innerHTML = `
    <span class="tree-chevron" id="chevron-${lib.id}">▼</span>
    <span>📁</span>
    <span class="tree-name">${escapeHtml(lib.name)}</span>
    <span class="lib-count">(${total})</span>
    <button class="remove-lib" onclick="event.stopPropagation();rescanLibrary('${lib.id}')" title="再スキャン" style="opacity:0;margin-left:0">↺</button>
    <button class="remove-lib" onclick="event.stopPropagation();confirmRemoveLibrary('${lib.id}')" title="ライブラリを削除">✕</button>
  `;

  const children = document.createElement('div');
  children.id = `tree-children-${lib.id}`;
  children.style.paddingLeft = '12px';

  let collapsed = false;
  header.addEventListener('click', () => {
    collapsed = !collapsed;
    children.style.display = collapsed ? 'none' : '';
    document.getElementById(`chevron-${lib.id}`).textContent = collapsed ? '▶' : '▼';
  });

  root.appendChild(header);

  const filtered = filterAndSort(lib.files);
  if (!filtered.length) {
    children.innerHTML = '<div class="tree-empty">該当するファイルがありません</div>';
  } else {
    filtered.forEach(node => children.appendChild(buildNode(node)));
  }
  root.appendChild(children);
  return root;
}

function buildNode(node, depth = 0) {
  if (node.type === 'dir') {
    const wrap = document.createElement('div');
    wrap.className = 'tree-folder';

    const header = document.createElement('div');
    header.className = 'tree-folder-header';
    header.style.paddingLeft = `${depth * 12 + 8}px`;

    let open = true;
    const chevron = document.createElement('span');
    chevron.className = 'tree-chevron';
    chevron.textContent = '▼';

    header.appendChild(chevron);
    header.appendChild(Object.assign(document.createElement('span'), { className: 'tree-icon', textContent: '📁' }));
    header.appendChild(Object.assign(document.createElement('span'), { className: 'tree-name', textContent: node.name }));

    const childWrap = document.createElement('div');
    const filtered = filterAndSort(node.children);
    filtered.forEach(child => childWrap.appendChild(buildNode(child, depth + 1)));

    header.addEventListener('click', () => {
      open = !open;
      childWrap.style.display = open ? '' : 'none';
      chevron.textContent = open ? '▼' : '▶';
    });

    wrap.appendChild(header);
    wrap.appendChild(childWrap);
    return wrap;
  }

  // file node
  const el = document.createElement('div');
  el.className = 'tree-file';
  el.dataset.path = node.path;
  el.style.paddingLeft = `${depth * 12 + 8}px`;

  const iconMap  = { html:'📄', md:'📝', pdf:'📕', xlsx:'📊', pptx:'📑' };
  const badgeMap = { html:'<span class="file-type-badge badge-html">HTML</span>', md:'<span class="file-type-badge badge-md">MD</span>', pdf:'<span class="file-type-badge badge-pdf">PDF</span>', xlsx:'<span class="file-type-badge badge-xlsx">XLS</span>', pptx:'<span class="file-type-badge badge-pptx">PPT</span>' };
  const icon  = iconMap[node.ext]  ?? '📄';
  const badge = badgeMap[node.ext] ?? '';
  const size = formatSize(node.size);
  const date = formatDate(node.modified);

  el.innerHTML = `
    <span class="tree-icon">${icon}</span>
    <span class="tree-name" title="${escapeHtml(node.path)}">${escapeHtml(node.name)}</span>
    ${badge}
    <span class="tree-meta">${date}${size ? ' · ' + size : ''}</span>
  `;

  el.addEventListener('click', () => openFile(node));
  return el;
}

function filterAndSort(nodes) {
  let items = [...nodes];

  // filter by type
  if (state.filter !== 'all') {
    items = items.map(n => {
      if (n.type === 'dir') {
        const filtered = filterAndSort(n.children);
        return filtered.length ? { ...n, children: filtered } : null;
      }
      return n.ext === state.filter ? n : null;
    }).filter(Boolean);
  }

  // filter by search
  if (state.searchQuery) {
    const q = state.searchQuery.toLowerCase();
    items = items.map(n => {
      if (n.type === 'dir') {
        const filtered = filterAndSort(n.children);
        return filtered.length ? { ...n, children: filtered } : null;
      }
      return n.name.toLowerCase().includes(q) ? n : null;
    }).filter(Boolean);
  }

  // sort files (dirs always first)
  const dirs = items.filter(n => n.type === 'dir');
  let files = items.filter(n => n.type === 'file');

  const [key, dir] = state.sort.split('-');
  files.sort((a, b) => {
    let va = key === 'date' ? a.modified : a.name.toLowerCase();
    let vb = key === 'date' ? b.modified : b.name.toLowerCase();
    if (va < vb) return dir === 'asc' ? -1 : 1;
    if (va > vb) return dir === 'asc' ? 1 : -1;
    return 0;
  });

  return [...dirs, ...files];
}

// ─────────────────────────────────────────────
// PDF renderer
// ─────────────────────────────────────────────
function renderPDF(buffer) {
  showPanel('pdf');
  const blob = new Blob([buffer], { type: 'application/pdf' });
  if (state.pdfBlobUrl) URL.revokeObjectURL(state.pdfBlobUrl);
  state.pdfBlobUrl = URL.createObjectURL(blob);
  document.getElementById('pdf-iframe').src = state.pdfBlobUrl;
}

// ─────────────────────────────────────────────
// Excel renderer (SheetJS)
// ─────────────────────────────────────────────
function renderXLSX(buffer) {
  showPanel('xlsx');
  if (typeof XLSX === 'undefined') { toast('SheetJS の読み込み中です。少し待ってから再度開いてください。', 'error'); return; }
  const wb = XLSX.read(buffer, { type: 'array', cellStyles: true });
  state.xlsxWorkbook = wb;
  renderSheet(wb, 0);
}

function renderSheet(wb, sheetIdx) {
  const tabsEl = document.getElementById('xlsx-tabs');
  const contentEl = document.getElementById('xlsx-content');

  // Sheet tabs
  tabsEl.innerHTML = '';
  wb.SheetNames.forEach((name, i) => {
    const btn = document.createElement('button');
    btn.className = `xlsx-tab${i === sheetIdx ? ' active' : ''}`;
    btn.textContent = name;
    btn.onclick = () => renderSheet(wb, i);
    tabsEl.appendChild(btn);
  });

  const ws = wb.Sheets[wb.SheetNames[sheetIdx]];
  if (!ws || !ws['!ref']) {
    contentEl.innerHTML = '<div class="xlsx-empty">シートにデータがありません</div>';
    return;
  }

  const range = XLSX.utils.decode_range(ws['!ref']);
  const maxRow = Math.min(range.e.r, 999);
  const maxCol = Math.min(range.e.c, 99);

  const colLetters = [];
  for (let c = range.s.c; c <= maxCol; c++) {
    colLetters.push(XLSX.utils.encode_col(c));
  }

  let html = '<div class="xlsx-table-wrap"><table class="xlsx-table"><thead><tr><th></th>';
  colLetters.forEach(l => { html += `<th>${l}</th>`; });
  html += '</tr></thead><tbody>';

  for (let r = range.s.r; r <= maxRow; r++) {
    html += `<tr><td class="xlsx-row-header">${r + 1}</td>`;
    for (let c = range.s.c; c <= maxCol; c++) {
      const addr = XLSX.utils.encode_cell({ r, c });
      const cell = ws[addr];
      let val = '';
      if (cell) {
        val = cell.w !== undefined ? cell.w : XLSX.utils.format_cell(cell);
      }
      const align = cell && (cell.t === 'n' || cell.t === 'd') ? ' style="text-align:right"' : '';
      html += `<td${align} title="${escapeHtml(String(val))}">${escapeHtml(String(val))}</td>`;
    }
    html += '</tr>';
  }
  html += '</tbody></table></div>';
  if (maxRow < range.e.r || maxCol < range.e.c) {
    html += `<div class="xlsx-empty" style="font-size:11px;padding:8px 16px;color:#999">表示制限: ${range.e.r + 1}行 × ${range.e.c + 1}列 のうち先頭 ${maxRow + 1}行 × ${maxCol + 1}列を表示</div>`;
  }
  contentEl.innerHTML = html;
}

// ─────────────────────────────────────────────
// PPTX renderer (JSZip + XML parsing)
// ─────────────────────────────────────────────
const PPTX_NS = {
  p: 'http://schemas.openxmlformats.org/presentationml/2006/main',
  a: 'http://schemas.openxmlformats.org/drawingml/2006/main',
  r: 'http://schemas.openxmlformats.org/officeDocument/2006/relationships',
};

function pEl(doc, ns, tag) { return Array.from(doc.getElementsByTagNameNS(PPTX_NS[ns], tag)); }
function pEl1(doc, ns, tag) { return doc.getElementsByTagNameNS(PPTX_NS[ns], tag)[0]; }

async function renderPPTX(buffer) {
  showPanel('pptx');
  document.getElementById('pptx-canvas').innerHTML = '<div style="color:#888;padding:32px;font-size:13px">読み込み中…</div>';
  if (typeof JSZip === 'undefined') { toast('JSZip の読み込み中です。再度開いてください。', 'error'); return; }

  const zip = await JSZip.loadAsync(buffer);

  // Slide dimensions from presentation.xml
  let cxEmu = 9144000, cyEmu = 5143500;
  const presXmlText = await zip.files['ppt/presentation.xml']?.async('text');
  if (presXmlText) {
    const doc = new DOMParser().parseFromString(presXmlText, 'application/xml');
    const sz = pEl1(doc, 'p', 'sldSz');
    if (sz) { cxEmu = +sz.getAttribute('cx') || cxEmu; cyEmu = +sz.getAttribute('cy') || cyEmu; }
  }

  // Theme colors
  const themeColors = await parsePPTXTheme(zip);

  // Slide files in order
  const slideKeys = Object.keys(zip.files)
    .filter(k => /^ppt\/slides\/slide\d+\.xml$/.test(k))
    .sort((a, b) => parseInt(a.match(/\d+/)) - parseInt(b.match(/\d+/)));

  const slides = [];
  for (const key of slideKeys) {
    const num = key.match(/slide(\d+)/)[1];
    const xmlText = await zip.files[key].async('text');
    const relsText = await zip.files[`ppt/slides/_rels/slide${num}.xml.rels`]?.async('text');
    const slide = await parsePPTXSlide(xmlText, relsText, zip, cxEmu, cyEmu, themeColors);
    slides.push(slide);
  }

  state.pptxSlides = slides;
  state.currentSlide = 0;
  drawSlide(0);
  buildSlideNav();
}

async function parsePPTXTheme(zip) {
  const colors = {};
  const themeFile = Object.keys(zip.files).find(k => /^ppt\/theme\/theme\d+\.xml$/.test(k));
  if (!themeFile) return colors;
  const xml = await zip.files[themeFile].async('text');
  const doc = new DOMParser().parseFromString(xml, 'application/xml');
  const fmtScheme = doc.getElementsByTagName('a:fmtScheme')[0];
  const clrScheme = doc.getElementsByTagName('a:clrScheme')[0];
  if (!clrScheme) return colors;
  const names = ['dk1','lt1','dk2','lt2','accent1','accent2','accent3','accent4','accent5','accent6'];
  names.forEach(name => {
    const el = clrScheme.getElementsByTagName(`a:${name}`)[0];
    if (!el) return;
    const srgb = el.getElementsByTagName('a:srgbClr')[0];
    const sys  = el.getElementsByTagName('a:sysClr')[0];
    colors[name] = srgb ? '#' + srgb.getAttribute('val') : (sys ? '#' + sys.getAttribute('lastClr') : '#000000');
  });
  return colors;
}

async function parsePPTXSlide(xmlText, relsText, zip, cxEmu, cyEmu, themeColors) {
  const doc = new DOMParser().parseFromString(xmlText, 'application/xml');

  // Build rId → media path map
  const rIdMap = {};
  if (relsText) {
    const rDoc = new DOMParser().parseFromString(relsText, 'application/xml');
    Array.from(rDoc.getElementsByTagName('Relationship')).forEach(rel => {
      rIdMap[rel.getAttribute('Id')] = rel.getAttribute('Target');
    });
  }

  const W = 960, H = Math.round(960 * cyEmu / cxEmu);
  const scaleX = W / cxEmu, scaleY = H / cyEmu;

  const elements = [];

  // Background color
  let bgColor = '#ffffff';
  const bgEl = pEl1(doc, 'p', 'bg');
  if (bgEl) {
    const solidFill = bgEl.getElementsByTagNameNS(PPTX_NS.a, 'solidFill')[0];
    if (solidFill) bgColor = resolveColor(solidFill, themeColors) || bgColor;
  }

  // Shape elements (text boxes, shapes)
  const spList = pEl(doc, 'p', 'sp');
  for (const sp of spList) {
    const el = parseShape(sp, scaleX, scaleY, themeColors);
    if (el) elements.push(el);
  }

  // Pictures
  const picList = pEl(doc, 'p', 'pic');
  for (const pic of picList) {
    const el = await parsePicture(pic, scaleX, scaleY, rIdMap, zip);
    if (el) elements.push(el);
  }

  // Group shapes (recursive first-level only)
  const grpList = pEl(doc, 'p', 'grpSp');
  for (const grp of grpList) {
    const subSps = Array.from(grp.getElementsByTagNameNS(PPTX_NS.p, 'sp'));
    for (const sp of subSps) {
      const el = parseShape(sp, scaleX, scaleY, themeColors);
      if (el) elements.push(el);
    }
  }

  return { elements, bgColor, width: W, height: H };
}

function parseShape(sp, scaleX, scaleY, themeColors) {
  const xfrm = sp.getElementsByTagNameNS(PPTX_NS.a, 'xfrm')[0];
  if (!xfrm) return null;
  const off = xfrm.getElementsByTagNameNS(PPTX_NS.a, 'off')[0];
  const ext = xfrm.getElementsByTagNameNS(PPTX_NS.a, 'ext')[0];
  if (!off || !ext) return null;

  const x = Math.round(+off.getAttribute('x') * scaleX);
  const y = Math.round(+off.getAttribute('y') * scaleY);
  const w = Math.round(+ext.getAttribute('cx') * scaleX);
  const h = Math.round(+ext.getAttribute('cy') * scaleY);

  // Fill color
  let bgColor = 'transparent';
  const spPr = sp.getElementsByTagNameNS(PPTX_NS.p, 'spPr')[0];
  if (spPr) {
    const solidFill = spPr.getElementsByTagNameNS(PPTX_NS.a, 'solidFill')[0];
    if (solidFill) bgColor = resolveColor(solidFill, themeColors) || bgColor;
    const noFill = spPr.getElementsByTagNameNS(PPTX_NS.a, 'noFill')[0];
    if (noFill) bgColor = 'transparent';
  }

  // Text
  const txBody = sp.getElementsByTagNameNS(PPTX_NS.a, 'txBody')[0];
  if (!txBody) return { kind: 'shape', x, y, w, h, bgColor, html: '' };

  const paras = Array.from(txBody.getElementsByTagNameNS(PPTX_NS.a, 'p'));
  const htmlLines = paras.map(para => {
    const runs = Array.from(para.getElementsByTagNameNS(PPTX_NS.a, 'r'));
    if (!runs.length) return '<p style="margin:0;line-height:1.3">&nbsp;</p>';

    // Para-level alignment
    const pPr = para.getElementsByTagNameNS(PPTX_NS.a, 'pPr')[0];
    const align = pPr?.getAttribute('algn') || 'l';
    const alignMap = { l:'left', ctr:'center', r:'right', just:'justify' };
    const textAlign = alignMap[align] || 'left';

    const spans = runs.map(run => {
      const t = run.getElementsByTagNameNS(PPTX_NS.a, 't')[0];
      if (!t) return '';
      const text = escapeHtml(t.textContent || '');
      const rPr = run.getElementsByTagNameNS(PPTX_NS.a, 'rPr')[0];
      let style = '';
      if (rPr) {
        const sz = rPr.getAttribute('sz'); // hundredths of a point
        if (sz) style += `font-size:${Math.round(+sz / 100 * scaleY / 14)}em;`;
        if (rPr.getAttribute('b') === '1') style += 'font-weight:700;';
        if (rPr.getAttribute('i') === '1') style += 'font-style:italic;';
        const solidFill = rPr.getElementsByTagNameNS(PPTX_NS.a, 'solidFill')[0];
        const color = solidFill ? resolveColor(solidFill, themeColors) : null;
        if (color) style += `color:${color};`;
      }
      return `<span style="${style}">${text}</span>`;
    }).join('');

    return `<p style="margin:0;line-height:1.35;text-align:${textAlign}">${spans}</p>`;
  }).join('');

  // Vertical alignment
  const bodyPr = txBody.getElementsByTagNameNS(PPTX_NS.a, 'bodyPr')[0];
  const anchor = bodyPr?.getAttribute('anchor') || 't';
  const justMap = { t:'flex-start', ctr:'center', b:'flex-end' };
  const justifyContent = justMap[anchor] || 'flex-start';

  return { kind: 'text', x, y, w, h, bgColor, html: htmlLines, justifyContent };
}

async function parsePicture(pic, scaleX, scaleY, rIdMap, zip) {
  const xfrm = pic.getElementsByTagNameNS(PPTX_NS.a, 'xfrm')[0];
  if (!xfrm) return null;
  const off = xfrm.getElementsByTagNameNS(PPTX_NS.a, 'off')[0];
  const ext = xfrm.getElementsByTagNameNS(PPTX_NS.a, 'ext')[0];
  if (!off || !ext) return null;

  const x = Math.round(+off.getAttribute('x') * scaleX);
  const y = Math.round(+off.getAttribute('y') * scaleY);
  const w = Math.round(+ext.getAttribute('cx') * scaleX);
  const h = Math.round(+ext.getAttribute('cy') * scaleY);

  const blip = pic.getElementsByTagNameNS(PPTX_NS.a, 'blip')[0];
  if (!blip) return null;
  const rId = blip.getAttributeNS(PPTX_NS.r, 'embed');
  if (!rId) return null;

  const target = rIdMap[rId]; // e.g. "../media/image1.png"
  if (!target) return null;
  const mediaPath = 'ppt/slides/' + target.replace(/^\.\.\//, '');
  const mediaFile = zip.files[mediaPath] || zip.files['ppt/' + target.replace(/^\.\.\//, '')];
  if (!mediaFile) return null;

  const ext2 = target.split('.').pop().toLowerCase();
  const mimeMap = { png:'image/png', jpg:'image/jpeg', jpeg:'image/jpeg', gif:'image/gif', svg:'image/svg+xml', webp:'image/webp' };
  const mime = mimeMap[ext2] || 'image/png';
  const blob = await mediaFile.async('blob');
  const src = URL.createObjectURL(new Blob([blob], { type: mime }));

  return { kind: 'image', x, y, w, h, src };
}

function resolveColor(fillEl, themeColors) {
  const srgb = fillEl.getElementsByTagNameNS(PPTX_NS.a, 'srgbClr')[0];
  if (srgb) {
    let hex = '#' + srgb.getAttribute('val');
    return applyColorMods(hex, srgb);
  }
  const schemeClr = fillEl.getElementsByTagNameNS(PPTX_NS.a, 'schemeClr')[0];
  if (schemeClr) {
    const name = schemeClr.getAttribute('val');
    let hex = themeColors[name] || '#000000';
    return applyColorMods(hex, schemeClr);
  }
  const prstClr = fillEl.getElementsByTagNameNS(PPTX_NS.a, 'prstClr')[0];
  if (prstClr) return '#' + (CSS_COLOR_NAMES[prstClr.getAttribute('val')] || '000000');
  return null;
}

function applyColorMods(hex, el) {
  // Handle lumMod / lumOff (basic lightness adjustment)
  const lumMod = el.getElementsByTagNameNS(PPTX_NS.a, 'lumMod')[0];
  const lumOff = el.getElementsByTagNameNS(PPTX_NS.a, 'lumOff')[0];
  if (!lumMod && !lumOff) return hex;
  try {
    const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
    const mod = lumMod ? +lumMod.getAttribute('val') / 100000 : 1;
    const off = lumOff ? +lumOff.getAttribute('val') / 100000 : 0;
    const clamp = v => Math.max(0, Math.min(255, Math.round(v)));
    const nr = clamp(r * mod + off * 255);
    const ng = clamp(g * mod + off * 255);
    const nb = clamp(b * mod + off * 255);
    return `rgb(${nr},${ng},${nb})`;
  } catch { return hex; }
}

const CSS_COLOR_NAMES = { black:'000000', white:'ffffff', red:'ff0000', green:'008000', blue:'0000ff', yellow:'ffff00', orange:'ffa500', purple:'800080', gray:'808080', grey:'808080' };

function drawSlide(idx) {
  const slides = state.pptxSlides;
  if (!slides.length) return;
  const slide = slides[idx];
  const canvas = document.getElementById('pptx-canvas');

  // Scale to fit the wrap area
  const wrap = document.getElementById('pptx-canvas-wrap');
  const maxW = wrap.clientWidth  - 48;
  const maxH = wrap.clientHeight - 48;
  const scale = Math.min(maxW / slide.width, maxH / slide.height, 1);
  const dispW = Math.round(slide.width  * scale);
  const dispH = Math.round(slide.height * scale);

  canvas.style.width  = dispW + 'px';
  canvas.style.height = dispH + 'px';
  canvas.style.background = slide.bgColor;
  canvas.innerHTML = '';

  const sf = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  sf.style.cssText = `position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none`;

  for (const el of slide.elements) {
    const sx = el.x * scale, sy = el.y * scale;
    const sw = el.w * scale, sh = el.h * scale;

    if (el.kind === 'image') {
      const img = document.createElement('img');
      img.src = el.src;
      img.style.cssText = `position:absolute;left:${sx}px;top:${sy}px;width:${sw}px;height:${sh}px;object-fit:contain`;
      canvas.appendChild(img);
      continue;
    }

    const div = document.createElement('div');
    div.className = 'pptx-el';
    div.style.cssText = `left:${sx}px;top:${sy}px;width:${sw}px;height:${sh}px;background:${el.bgColor || 'transparent'};justify-content:${el.justifyContent || 'flex-start'};padding:${Math.max(2, sw*0.02)}px;font-size:${Math.round(scale * 13)}px`;
    div.innerHTML = el.html || '';
    canvas.appendChild(div);
  }
}

function buildSlideNav() {
  const slides = state.pptxSlides;
  document.getElementById('slide-counter').textContent = `1 / ${slides.length}`;
  document.getElementById('pptx-prev').disabled = true;
  document.getElementById('pptx-next').disabled = slides.length <= 1;
  const strip = document.getElementById('pptx-thumb-strip');
  strip.innerHTML = '';
  slides.forEach((_, i) => {
    const thumb = document.createElement('div');
    thumb.className = `pptx-thumb${i === 0 ? ' active' : ''}`;
    thumb.innerHTML = `<span>${i + 1}</span>`;
    thumb.onclick = () => goSlide(i);
    strip.appendChild(thumb);
  });
}

function goSlide(idx) {
  const slides = state.pptxSlides;
  state.currentSlide = Math.max(0, Math.min(idx, slides.length - 1));
  drawSlide(state.currentSlide);
  document.getElementById('slide-counter').textContent = `${state.currentSlide + 1} / ${slides.length}`;
  document.getElementById('pptx-prev').disabled = state.currentSlide === 0;
  document.getElementById('pptx-next').disabled = state.currentSlide === slides.length - 1;
  document.querySelectorAll('.pptx-thumb').forEach((t, i) => t.classList.toggle('active', i === state.currentSlide));
  document.querySelectorAll('.pptx-thumb')[state.currentSlide]?.scrollIntoView({ block:'nearest', inline:'center' });
}

function prevSlide() { goSlide(state.currentSlide - 1); }
function nextSlide() { goSlide(state.currentSlide + 1); }

function printFile() {

  if (state.currentFile.type === 'html') {
    document.getElementById('html-iframe').contentWindow.print();
  } else {
    window.print();
  }
}

function setFilter(f) {
  state.filter = f;
  document.querySelectorAll('.filter-tab').forEach(el => {
    el.classList.toggle('active', el.dataset.filter === f);
  });
  renderTree();
}

function setSort(s) {
  state.sort = s;
  renderTree();
}

let searchTimer;
function onSearch(q) {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => {
    state.searchQuery = q;
    renderTree();
  }, 250);
}

// ─────────────────────────────────────────────
// Utilities
// ─────────────────────────────────────────────
function escapeHtml(str) {
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function formatSize(bytes) {
  if (!bytes) return '';
  if (bytes < 1024) return bytes + 'B';
  return (bytes / 1024).toFixed(0) + 'KB';
}

function formatDate(ts) {
  if (!ts) return '';
  const d = new Date(ts);
  return `${d.getFullYear().toString().slice(2)}/${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')}`;
}

function confirmRemoveLibrary(id) {
  const lib = state.libraries.find(l => l.id === id);
  if (lib && confirm(`「${lib.name}」をライブラリから削除しますか？\n（ファイル自体は削除されません）`)) {
    removeLibrary(id);
  }
}

function toast(msg, type = '') {
  const container = document.getElementById('toast-container');
  const el = document.createElement('div');
  el.className = `toast${type ? ' ' + type : ''}`;
  el.textContent = msg;
  container.appendChild(el);
  setTimeout(() => el.remove(), 3000);
}

// ─────────────────────────────────────────────
// Keyboard shortcuts
// ─────────────────────────────────────────────
document.addEventListener('keydown', e => {
  if ((e.metaKey || e.ctrlKey) && e.key === 's') {
    e.preventDefault();
    saveFile();
  }
  if (state.currentFile?.type === 'pptx') {
    if (e.key === 'ArrowRight' || e.key === 'ArrowDown') { e.preventDefault(); nextSlide(); }
    if (e.key === 'ArrowLeft'  || e.key === 'ArrowUp')   { e.preventDefault(); prevSlide(); }
  }
});

// ─────────────────────────────────────────────
// Sidebar toggle
// ─────────────────────────────────────────────
document.getElementById('sidebar-toggle').addEventListener('click', () => {
  document.getElementById('app').classList.toggle('sidebar-collapsed');
  if (state.currentFile?.type === 'pptx') setTimeout(() => drawSlide(state.currentSlide), 220);
});

window.addEventListener('resize', () => {
  if (state.currentFile?.type === 'pptx') drawSlide(state.currentSlide);
});

// ─────────────────────────────────────────────
async function init() {
  // Protocol check
  if (location.protocol === 'file:') {
    document.getElementById('proto-warn').style.display = 'block';
  }

  // Check File System Access API
  if (!window.showDirectoryPicker) {
    toast('このブラウザは File System Access API に対応していません。Chrome または Edge を使用してください。', 'error');
    return;
  }

  // Restore libraries from IndexedDB
  let lastPath = null;
  try { lastPath = localStorage.getItem('xop-last-path'); } catch {}

  try {
    const records = await DB.getAll();
    const sidebar = document.getElementById('sidebar');
    const treeEl = document.getElementById('file-tree');

    for (const { id, handle, name } of records) {
      const perm = await handle.queryPermission({ mode: 'readwrite' });
      if (perm === 'granted') {
        await loadLibrary({ id, handle, name }, false);
      } else {
        pendingHandles.set(id, handle);
        const banner = document.createElement('div');
        banner.className = 'restore-banner';
        banner.id = `restore-${id}`;
        banner.innerHTML = `
          <span>📁 ${escapeHtml(name)}</span>
          <button onclick="restoreLibrary('${escapeHtml(id)}')">アクセスを復元</button>
        `;
        sidebar.insertBefore(banner, treeEl);
      }
    }

    // Auto-open last file
    if (lastPath) {
      const node = findFileByPath(lastPath);
      if (node) openFile(node);
    }
  } catch (e) {
    console.warn('IndexedDB restore failed:', e);
  }
}

function findFileByPath(path) {
  for (const lib of state.libraries) {
    const found = searchNodes(lib.files, path);
    if (found) return found;
  }
  return null;
}

function searchNodes(nodes, path) {
  for (const node of nodes) {
    if (node.type === 'file' && node.path === path) return node;
    if (node.type === 'dir' && node.children) {
      const found = searchNodes(node.children, path);
      if (found) return found;
    }
  }
  return null;
}

init();
</script>
